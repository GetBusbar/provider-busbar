name: coverage

# Non-gating Codecov coverage. Separate from CI so it can never affect the
# required checks. The whole job is continue-on-error and the upload is
# fail_ci_if_error: false, so a coverage hiccup never blocks a merge.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # submodules: recursive matches ci.yml — the generated Upjet provider
      # pulls its CRD/controller sources from submodules.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: go test -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: coverage.txt
          fail_ci_if_error: false
