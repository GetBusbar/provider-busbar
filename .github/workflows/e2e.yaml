name: End to End Testing

on:
  issue_comment:
    types: [created]

env:
  GO_VERSION: "1.24"

permissions: {}
jobs:
  check-permissions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      permission: ${{ steps.check-permissions.outputs.permission }}
    steps:
      - name: Get Commenter Permissions
        id: check-permissions
        run: |
          echo "Trigger keyword: '/test-examples'"
          echo "Go version: ${{ env.GO_VERSION }}"

          REPO=${{ github.repository }}
          COMMENTER=${{ github.event.comment.user.login }}

          # Fetch the commenter's repo-level permission grant
          GRANTED=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/collaborators/$COMMENTER/permission" | jq -r .permission)

          # Make it accessible in the workflow via a job output -- cannot use env
          echo "User $COMMENTER has $GRANTED permissions"
          echo "permission=$GRANTED" >> "$GITHUB_OUTPUT"

  get-example-list:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    needs: check-permissions
    if: ${{ (needs.check-permissions.outputs.permission == 'admin' || needs.check-permissions.outputs.permission == 'write') && github.event.issue.pull_request != null && contains(github.event.comment.body, '/test-examples')}}
    runs-on: ubuntu-latest
    outputs:
      example_list: ${{ steps.get-example-list-name.outputs.example-list }}
      example_hash: ${{ steps.get-example-list-name.outputs.example-hash }}
      commit_sha: ${{ steps.request.outputs.commit-sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Validate immutable approval
        id: request
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: python3 scripts/e2e_request.py

      - name: Checkout approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.commit-sha }}
          submodules: true
          persist-credentials: false

      - name: Prepare The Example List
        env:
          REQUESTED_PATHS: ${{ steps.request.outputs.requested-paths }}
        id: get-example-list-name
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          files = []
          for requested in os.environ['REQUESTED_PATHS'].split(','):
              path = Path(requested)
              matches = [path] if path.is_file() else sorted(path.rglob('*.yaml'))
              if not matches:
                  raise SystemExit('No examples found for requested path')
              for match in matches:
                  value = match.as_posix()
                  if match.suffix != '.yaml' or any(c not in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_./-' for c in value):
                      raise SystemExit('Invalid example filename')
                  files.append(value)
          examples = ','.join(sorted(set(files)))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('example-list=' + examples + '\n')
              output.write('example-hash=' + hashlib.sha256(examples.encode()).hexdigest() + '\n')
          PYTHON


      - name: Create Pending Status Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ steps.request.outputs.commit-sha }} \
            -f state='pending' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Running...' \
            -f context="Uptest-${{ steps.get-example-list-name.outputs.example-hash }}"

  uptest:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    needs:
      - check-permissions
      - get-example-list
    if: ${{ (needs.check-permissions.outputs.permission == 'admin' || needs.check-permissions.outputs.permission == 'write') && github.event.issue.pull_request != null && contains(github.event.comment.body, '/test-examples')}}
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          large-packages: false
          swap-storage: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: all

      - name: Checkout approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get-example-list.outputs.commit_sha }}
          submodules: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Run Uptest
        id: run-uptest
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
          UPTEST_EXAMPLE_LIST: ${{ needs.get-example-list.outputs.example_list }}
          UPTEST_TEST_DIR: ./_output/controlplane-dump
          UPTEST_DATASOURCE_PATH: .work/uptest-datasource.yaml
          UPTEST_UPDATE_PARAMETER: ""
          UPTEST_DATASOURCE: ${{ secrets.UPTEST_DATASOURCE }}
        run: |
          mkdir -p .work
          printf '%s\n' "$UPTEST_DATASOURCE" > .work/uptest-datasource.yaml
          make e2e


      - name: Create Successful Status Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXAMPLE_HASH: ${{ needs.get-example-list.outputs.example_hash }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ needs.get-example-list.outputs.commit_sha }} \
            -f state='success' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Passed' \
            -f context="Uptest-${EXAMPLE_HASH}"


      - name: Collect Cluster Dump
        if: always()
        run: |
          make controlplane.dump


      - name: Upload Cluster Dump
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlplane-dump
          path: ./_output/controlplane-dump

      - name: Cleanup
        if: always()
        run: |
          eval "$(make --no-print-directory build.vars)"
          ${KUBECTL} delete managed --all || true


      - name: Create Unsuccessful Status Check
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXAMPLE_HASH: ${{ needs.get-example-list.outputs.example_hash }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ needs.get-example-list.outputs.commit_sha }} \
            -f state='failure' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Failed' \
            -f context="Uptest-${EXAMPLE_HASH}"
