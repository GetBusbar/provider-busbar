# Standalone build + Upjet generation drift check for provider-busbar.
# The full matrix (lint, unit tests, e2e) lives in ci.yml; this focused
# workflow makes the "did you forget to run `make generate`?" signal explicit.
name: Generate Drift

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch: {}

env:
  GO_VERSION: '1.25.9'

jobs:
  build-and-drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Generate
        run: make generate

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'make generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi
          echo "No drift: generated artifacts are up to date."
