name: getbusbar/busbar
resources:
    busbar_config:
        subCategory: ""
        description: 'A GitOps singleton that owns the running busbar config and applies it wholesale (POST /api/v1/admin/config/apply). Manage at most ONE of these per gateway. The document is the full JSON config payload busbar boots from ({"config": {...}, "providers": {...}}); applying it bumps config_version. Applies are LIVE-ONLY by default — they revert to disk truth on the next reload or restart unless the gateway persists an overlay. Destroying this resource is a no-op on the gateway (there is no unapply); it only drops Terraform''s tracking.'
        name: busbar_config
        title: busbar_config Resource - busbar
        examples:
            - name: running
              manifest: |-
                {
                  "document": "${jsonencode({\n    config = {\n      auth = {\n        chain = [\"keys\"]\n        admin_auth = [\n          { admin-tokens = { token = { env = \"BUSBAR_ADMIN_TOKEN\" } } }\n        ]\n      }\n      providers = {\n        anthropic = { api_key = { env = \"ANTHROPIC_API_KEY\" } }\n      }\n      models = {\n        \"claude-sonnet\" = { provider = \"anthropic\" }\n      }\n      groups = {\n        team-checkout = {}\n      }\n    }\n    providers = {\n      anthropic = { protocol = \"anthropic\", base_url = \"https://api.anthropic.com\" }\n    }\n  })}"
                }
        argumentDocs:
            config_version: (Number) The monotonic config version after the last apply. Process-local; resets to 0 on gateway restart.
            document: '(String) The full config apply document as a JSON string: {"config": {DeployCfg}, "providers": {name: ProviderDef}}. The config key is required; providers is optional. This is the write model (the boot-file shape), NOT the redacted read projection returned by GET /config.'
            id: (String) Fixed singleton id (always "config").
        importStatements:
            - |-
              # The config singleton has a fixed import id. The document is not recoverable
              # (GET /config is a redacted projection), so supply the matching `document` in
              # your configuration after import; only config_version is read live.
              terraform import busbar_config.running config
    busbar_hook:
        subCategory: ""
        description: 'A routing hook (busbar >= 1.5.0): a tap or gate backed by a signed kind: hook plugin, wired into busbar''s request/ranking pipeline (POST/GET/PUT/DELETE /api/v1/admin/hooks). The grant fields (kind, prompt, user) are immutable once registered — changing them replaces the hook.'
        name: busbar_hook
        title: busbar_hook Resource - busbar
        examples:
            - name: ranker
              manifest: |-
                {
                  "kind": "gate",
                  "name": "quality-ranker",
                  "on_error": "weighted",
                  "plugin": "ranking",
                  "priority": 10,
                  "prompt": "ro",
                  "settings": "${jsonencode({ min_score = 0.6 })}",
                  "timeout_ms": 100
                }
            - name: usage_tap
              manifest: |-
                {
                  "at": "completion",
                  "global": true,
                  "kind": "tap",
                  "name": "usage-telemetry",
                  "plugin": "usage-telemetry"
                }
        argumentDocs:
            at: '(String) Pipeline stage: request, route, attempt, or completion. Null lets busbar place it by kind.'
            default: (Boolean) Whether this hook is the default for its stage. Write-only (not echoed by reads).
            global: (Boolean) Whether the hook applies globally (all pools). Defaults to false. May read back true if wired via global_hooks.
            kind: '(String) Transport contract: tap (fire-and-forget, non-blocking) or gate (blocking, may rewrite/reject). Immutable grant; changing it replaces the hook.'
            name: (String) Unique hook name (<= 256 chars; not a reserved terminal name). Immutable; changing it replaces the hook.
            on_empty: '(String) Fallback policy when the hook yields an empty ranking: weighted, reject, or first. Write-only (not echoed by reads).'
            on_error: '(String) Behavior when the hook errors/times out: a terminal (weighted, reject, first, nothing) or another hook name. Defaults to nothing.'
            plugin: '(String) The signed kind: hook plugin this hook dispatches to (its NAME from the gateway''s plugin catalog, e.g. a compiled-in plugin such as ranking).'
            priority: (Number) Ordering priority within a stage. Defaults to 0.
            prompt: '(String) Prompt-content access grant: no, ro, or rw. Defaults to no. Immutable grant; changing it replaces the hook. (rw is invalid on a tap.)'
            settings: (String) Opaque per-hook settings as a JSON object string (<= 64KiB, <= 256 keys). Defaults to {}. The bag may carry SecretRefs, so busbar redacts it on every read (only the key names are echoed, as settings_keys); the provider keeps the last value it applied and detects drift by key names. Values changed outside Terraform with the SAME key set are invisible.
            timeout_ms: (Number) Per-call timeout in milliseconds. Defaults to 1.
            user: '(String) Caller-identity access grant: no or ro. Defaults to no. Immutable grant; changing it replaces the hook.'
        importStatements:
            - |-
              # Hooks are imported by name.
              terraform import busbar_hook.ranker quality-ranker
    busbar_virtual_key:
        subCategory: ""
        description: 'A governance virtual key (busbar >= 1.5.0): a mintable, revocable, EXPIRING signed-token credential, optionally bound to a groups: bucket that carries all budget and rate enforcement (POST/GET/PATCH/DELETE /api/v1/admin/keys). The signed token is returned by busbar only once, at creation, and is stored in state as a sensitive value; refreshes update metadata (group/enabled/state) but never the token. Requires governance to be enabled on the gateway.'
        name: busbar_virtual_key
        title: busbar_virtual_key Resource - busbar
        examples:
            - name: app
              manifest: |-
                {
                  "allowed_pools": [
                    "smart"
                  ],
                  "expires_in": "30d",
                  "group": "team-checkout",
                  "labels": {
                    "service": "checkout"
                  },
                  "name": "checkout-service"
                }
        argumentDocs:
            allowed_pools: (List of String) Pools this key may target. Omitted/null means ALL pools; an explicit empty list means NO pools. Immutable; changing it replaces the key.
            aws_access_key_id: (String) AWS-style access key id, when issue_aws_credential is true. Returned only at creation.
            aws_secret_access_key: (String, Sensitive) AWS-style secret access key, when issue_aws_credential is true. Returned only at creation; stored in state and never re-read.
            created_at: (Number) Epoch seconds the key was minted.
            enabled: (Boolean) Whether the key currently resolves. Defaults to true at mint. Mutable via PATCH (false = reversible disable; the key's state reads "disabled").
            expires_at: (Number) Token expiry as absolute Unix seconds. May be set at mint (mutually exclusive with expires_in) and is always computed from the mint response. Changing it replaces the key.
            expires_in: (String) Token lifetime as a duration string (e.g. 7d, 24h, 30m, 3600s); the token's expiry is mint-time + this. Mutually exclusive with expires_at. Omitting both applies the server default TTL. Write-only mint directive; changing it replaces the key.
            group: '(String) The groups: bucket this key binds to (at most one); all budget/rate enforcement flows through the group. The group must already exist unless parent is set (auto-provision). Omit for an authed-but-unlimited key. Mutable via PATCH: changing it rebinds, removing it unbinds.'
            group_provisioned: (Boolean) Whether the mint auto-provisioned its bound group leaf (self-service). Known only at creation.
            id: (String) Server-assigned key id (e.g. vk_0123456789abcdef).
            issue_aws_credential: (Boolean) When true, also mint an AWS-style access-key-id + secret access key (SigV4/Bedrock inbound auth). Both are returned only at creation. Immutable.
            labels: (Map of String) Mint-time labels echoed onto this key's metric series (Prometheus-safe names; never interpreted by enforcement). Immutable; changing them replaces the key.
            name: (String) Human-readable label (<= 256 chars). Immutable; changing it replaces the key.
            parent: '(String) Auto-provision target: the EXISTING parent group under which group is created as a leaf when it does not yet exist. Write-only mint directive (never echoed by reads). Changing it replaces the key.'
            state: '(String) Lifecycle state derived by the server: active, disabled, revoked, or tombstoned. A tombstoned/revoked key is treated as gone and planned for recreation.'
            token: (String, Sensitive) The busbar-signed bearer token (bbk_...) — the key credential. Returned only at creation; stored in state and never re-read.
        importStatements:
            - |-
              # Virtual keys are imported by their server-assigned id (the signed token
              # cannot be recovered — it is create-only — and stays null after import).
              terraform import busbar_virtual_key.app vk_0123456789abcdef
