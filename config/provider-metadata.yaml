name: getbusbar/busbar
resources:
    busbar_config:
        subCategory: ""
        description: 'A GitOps singleton that owns the running busbar config and applies it wholesale (POST /api/v1/admin/config/apply). Manage at most ONE of these per gateway. The document is the full JSON config payload busbar boots from ({"config": {...}, "providers": {...}}); applying it bumps config_version. Full documents are live-only and revert to disk plus overlay on reload or restart; persist changes in config.yaml. The gateway must allow mutations with a writable overlay. Destroying this resource is a no-op on the gateway (there is no unapply); it only drops Terraform''s tracking.'
        name: busbar_config
        title: busbar_config Resource - busbar
        examples:
            - name: running
              manifest: |-
                {
                  "document": "${jsonencode({\n    config = {\n      models = {\n        \"claude-sonnet\" = { provider = \"anthropic\", max_concurrent = 8, max_requests = -1 }\n      }\n      providers = {\n        anthropic = { api_key = { env = \"ANTHROPIC_API_KEY\" } }\n      }\n      auth = {\n        chain = [\"keys\"]\n        admin_auth = [{ \"admin-tokens\" = { token = { env = \"BUSBAR_ADMIN_TOKEN\" } } }]\n      }\n    }\n    providers = {\n      anthropic = { protocol = \"anthropic\", base_url = \"https://api.anthropic.com\" }\n    }\n  })}"
                }
        argumentDocs:
            config_version: (Number) The monotonic config version after the last apply. Process-local; resets to 0 on gateway restart.
            document: '(String, Sensitive) The full config apply document as a JSON string: {"config": {DeployCfg}, "providers": {name: ProviderDef}}. The config key is required; providers is optional. This is the write model (the boot-file shape), NOT the redacted read projection returned by GET /config.'
            id: (String) Fixed singleton id (always "config").
        importStatements:
            - |-
              # The config singleton has a fixed import id. The document is not recoverable
              # (GET /config is a redacted projection), so supply the matching `document` in
              # your configuration after import; only config_version is read live.
              terraform import busbar_config.running config
    busbar_hook:
        subCategory: ""
        description: A routing hook backed by an installed signed plugin (POST/GET/PUT/DELETE /api/v1/admin/hooks). The grant fields kind, prompt, and user are immutable; changing them replaces the hook. Settings are sensitive and write-only on current gateways; import cannot recover them.
        name: busbar_hook
        title: busbar_hook Resource - busbar
        examples:
            - name: ranker
              manifest: |-
                {
                  "kind": "gate",
                  "module": "my-installed-ranker",
                  "name": "quality-ranker",
                  "on_error": "weighted",
                  "priority": 10,
                  "prompt": "ro",
                  "settings": "${jsonencode({ min_score = 0.6 })}",
                  "timeout_ms": 100
                }
        argumentDocs:
            default: (Boolean) Whether this hook is the default for its stage. Defaults to false.
            global: (Boolean) Whether the hook applies globally (all pools). Defaults to false. May read back true if attached globally.
            kind: '(String) Transport contract: tap (fire-and-forget, non-blocking) or gate (blocking, may rewrite/reject). Immutable grant; changing it replaces the hook.'
            module: (String) Signed hook plugin name or alias installed on the gateway.
            name: (String) Unique hook name (<= 256 chars; not a reserved terminal name). Immutable; changing it replaces the hook.
            on_empty: '(String) Fallback policy when the hook yields an empty ranking: weighted, reject, or first. Unset reads back null.'
            on_error: '(String) Behavior when the hook errors/times out: a terminal (weighted, reject, first, nothing) or another hook name. Defaults to nothing.'
            phase: '(List of String) Configured pipeline stages: request, candidate, routing, or response. Omitted or empty selects all four core stages. Reads preserve the configured list.'
            priority: (Number) Ordering priority within a stage. Defaults to 0.
            prompt: '(String) Prompt-content access grant: no, ro, or rw. Defaults to no. Immutable grant; changing it replaces the hook. (rw is invalid on a tap.)'
            settings: (String, Sensitive) Opaque per-hook settings as a JSON object string (<= 64KiB, <= 256 keys). Defaults to {}.
            socket: (String, Deprecated) Unsupported since busbar 1.5; use module and plugin settings.
            timeout_ms: (Number) Per-call timeout in milliseconds. Defaults to 1.
            user: '(String) Caller-identity access grant: no or ro. Defaults to no. Immutable grant; changing it replaces the hook.'
            webhook: (String, Deprecated) Unsupported since busbar 1.5; use module and plugin settings.
        importStatements:
            - |-
              # Hooks are imported by name.
              terraform import busbar_hook.ranker quality-ranker
    busbar_virtual_key:
        subCategory: ""
        description: A signed, expiring busbar virtual key scoped to pools. The bearer token is returned once at creation and stored as a sensitive value. Budget and rate limits belong to gateway groups in busbar 1.5 and later; legacy key limit attributes are rejected.
        name: busbar_virtual_key
        title: busbar_virtual_key Resource - busbar
        examples:
            - name: app
              manifest: |-
                {
                  "allowed_pools": [
                    "smart"
                  ],
                  "name": "checkout-service"
                }
        argumentDocs:
            allowed_pools: (List of String) Pools this key may target. Unset means all pools; an empty list means no pools. Immutable; changing it replaces the key (the mint spec is fixed at creation).
            aws_access_key_id: (String) AWS-style access key id, when issue_aws_credential is true. Returned only at creation.
            aws_secret_access_key: (String, Sensitive) AWS-style secret access key, when issue_aws_credential is true. Returned only at creation; stored in state and never re-read.
            budget_period: (String, Deprecated) Unsupported since busbar 1.5; configure budget windows on gateway groups.
            created_at: (Number) Epoch seconds the key was minted.
            enabled: (Boolean) Whether the key currently resolves. A key is created enabled; disable it out-of-band via the admin API.
            id: (String) Server-assigned key id (e.g. vk_0123456789abcdef).
            issue_aws_credential: (Boolean) When true, also mint an AWS-style access-key-id + secret access key (SigV4/Bedrock inbound auth). Both are returned only at creation. Immutable.
            max_budget_cents: (Number, Deprecated) Unsupported since busbar 1.5; configure spend limits on gateway groups.
            name: (String) Human-readable label (<= 256 chars). Immutable; changing it replaces the key.
            rpm_limit: (Number, Deprecated) Unsupported since busbar 1.5; configure rate limits on gateway groups.
            secret: (String, Sensitive) The signed bearer token. Returned only at creation; stored in state and never re-read.
            tpm_limit: (Number, Deprecated) Unsupported since busbar 1.5; configure rate limits on gateway groups.
        importStatements:
            - |-
              # Virtual keys are imported by their server-assigned id (the plaintext secret
              # cannot be recovered — it is create-only — and stays null after import).
              terraform import busbar_virtual_key.app vk_0123456789abcdef
