apiVersion: busbar.busbar.crossplane.io/v1alpha1
kind: Config
metadata:
  annotations:
    meta.upbound.io/example-id: busbar/v1alpha1/config
  labels:
    testing.upbound.io/example-name: running
  name: running
spec:
  forProvider:
    document: |-
      ${jsonencode({
          config = {
            auth = {
              chain = ["keys"]
              admin_auth = [
                { admin-tokens = { token = { env = "BUSBAR_ADMIN_TOKEN" } } }
              ]
            }
            providers = {
              anthropic = { api_key = { env = "ANTHROPIC_API_KEY" } }
            }
            models = {
              "claude-sonnet" = { provider = "anthropic" }
            }
            groups = {
              team-checkout = {}
            }
          }
          providers = {
            anthropic = { protocol = "anthropic", base_url = "https://api.anthropic.com" }
          }
        })}
