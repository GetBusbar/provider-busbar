apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: gateway-config-document
stringData:
  # Replace this minimal document with your complete gateway configuration.
  document: |
    {"config":{"providers":{},"models":{},"pools":{}}}
---
apiVersion: busbar.busbar.m.crossplane.io/v1alpha1
kind: Config
metadata:
  namespace: default
  name: gateway-config
spec:
  forProvider:
    documentSecretRef:
      name: gateway-config-document
      key: document
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
